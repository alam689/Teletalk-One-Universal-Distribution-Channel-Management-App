<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the mobile bottom nav can sit inside the safe area
         on notched devices. maximum-scale is deliberately NOT set: pinch-zoom
         must stay available. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="description" content="Teletalk One — distribution channel management portal" />
    <meta name="theme-color" content="#0b7a4f" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#071310" media="(prefers-color-scheme: dark)" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/teletalk-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/teletalk-icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>টেলিটক ওয়ান</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      অ্যাপটি চালাতে জাভাস্ক্রিপ্ট চালু থাকা প্রয়োজন। / JavaScript is required to run this app.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
